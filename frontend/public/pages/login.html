<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — ApiForge</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- NAV -->
  <header class="nav">
    <div class="nav__inner">
      <a href="/" class="brand">Api<span>Forge</span></a>
      <nav class="nav__links" id="nav-links">
        <div class="nav__cta">
          <a href="/signup" class="btn btn--ghost">Create account</a>
        </div>
      </nav>
      <button class="nav__toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
      </button>
    </div>
  </header>

  <!-- AUTH -->
  <main class="auth">
    <div class="auth__card">
      <div class="auth__eyebrow">// authenticate</div>
      <h1>Login</h1>
      <p class="auth__subtitle">Access your projects, tables, and generated APIs.</p>

      <form id="login-form" novalidate>
        <div class="form__error" id="login-error" role="alert"></div>

        <div class="field">
          <label for="login-identifier">Email or username</label>
          <input id="login-identifier" name="identifier" type="text" placeholder="you@example.com or sifat" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>

        <button type="submit" id="login-submit" class="btn btn--primary btn--block auth__submit">Login</button>
      </form>

      <p class="auth__switch">Don't have an account? <a href="/signup">Create one →</a></p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer__inner">
      <span>© 2026 ApiForge — CSE216 project</span>
      <div class="footer__links">
        <a href="/">Home</a>
        <a href="/signup">Sign up</a>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
